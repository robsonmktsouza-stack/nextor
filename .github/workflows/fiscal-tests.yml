name: Fiscal Engine Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, openssl, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Clear Laravel caches
        run: php artisan optimize:clear

      - name: Run Fiscal PHPUnit
        run: |
          vendor/bin/phpunit \
            tests/Feature/FiscalFoundationTest.php \
            tests/Feature/FiscalCertificateIcpBrasilTest.php \
            tests/Feature/FiscalSchemaDocumentXmlTest.php \
            tests/Feature/FiscalTaxEngineTest.php \
            tests/Feature/FiscalSignatureEngineTest.php
