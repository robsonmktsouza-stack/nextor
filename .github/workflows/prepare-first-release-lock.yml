name: Prepare first release Composer lock
on:
  push:
    branches:
      - feature/acbr-nfe-bootstrap

permissions:
  contents: write

jobs:
  lock:
    if: "github.event.head_commit.message == 'chore(release): request composer.lock generation'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, dom, xml, curl, zip
          coverage: none
      - name: Resolve and lock dependencies
        run: |
          composer validate --no-check-publish
          composer update --no-install --no-scripts --no-interaction --prefer-dist --no-progress
          test -s composer.lock
          composer validate --no-check-publish --strict
          composer install --no-interaction --prefer-dist --no-progress
      - name: Smoke test locked application
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan route:list --path=login
          php vendor/bin/phpunit --filter='NFCeProductionParametersTest|InstanceIsolationTest|SaleReceiptReuseTest'
      - name: Commit composer.lock to working branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --exit-code && { echo "composer.lock already unchanged"; exit 0; }
          git commit -m "chore(release): pin composer dependencies for reproducible deployments"
          git push origin HEAD:feature/acbr-nfe-bootstrap
