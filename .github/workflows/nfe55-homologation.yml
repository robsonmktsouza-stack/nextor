name: NF-e 55 - homologação e segurança
on:
  push:
    branches: [develop]
    paths:
      - 'app/Services/Fiscal/Nfe55*'
      - 'app/Services/Fiscal/ACBr/ACBrNFeService.php'
      - 'app/Console/Commands/Nfe55PreflightCommand.php'
      - 'app/Http/Controllers/Nfe55EmissionController.php'
      - 'app/Http/Controllers/NfeDraftController.php'
      - 'app/Jobs/ProcessNfe55Job.php'
      - 'app/Jobs/ProcessNfe55CancellationJob.php'
      - 'app/Models/NfeDraft.php'
      - 'database/migrations/2026_10_23_000006_add_nfe55_transmission_fields.php'
      - 'database/migrations/2026_10_23_000007_add_nfe55_cancellation_fields.php'
      - 'resources/views/fiscal/nfe/**'
      - 'public/js/nfe-editor.js'
      - 'scripts/fiscal/Instalar-ACBrLibNFe-Windows.ps1'
      - 'routes/web.php'
      - 'tests/Feature/Nfe55EmissionFoundationTest.php'
      - 'tests/Feature/Nfe55DanfeTest.php'
      - 'tests/Feature/Nfe55CancellationTest.php'
      - 'tests/Feature/NfeFormCompletenessTest.php'
      - '.github/workflows/nfe55-homologation.yml'
  workflow_dispatch:
jobs:
  homologation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,openssl,pdo_sqlite,dom,xml,zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php -l app/Console/Commands/Nfe55PreflightCommand.php && php -l app/Services/Fiscal/ACBr/ACBrNFeService.php && php -l app/Services/Fiscal/Nfe55PreflightService.php && php -l app/Services/Fiscal/Nfe55IniBuilder.php && php -l app/Services/Fiscal/Nfe55EmissionService.php && php -l app/Services/Fiscal/Nfe55CancellationService.php && php -l app/Services/Fiscal/Nfe55DanfeService.php && php -l app/Jobs/ProcessNfe55Job.php && php -l app/Jobs/ProcessNfe55CancellationJob.php && php -l app/Http/Controllers/Nfe55EmissionController.php && php artisan view:cache && node --check public/js/nfe-editor.js
      - name: Validar sintaxe do instalador ACBr Windows
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/fiscal/Instalar-ACBrLibNFe-Windows.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($erro in $errors) { Write-Error $erro.Message }
            exit 1
          }
      - run: php artisan list --raw | grep -q 'nfe:preflight'
      - run: php artisan route:list --path=fiscal/nfe/drafts
      - run: php -d memory_limit=1024M vendor/bin/phpunit --filter='Nfe55EmissionFoundationTest|Nfe55DanfeTest|NfeEditorTest|NfeFormCompletenessTest|Nfe55CancellationTest' --display-errors --display-warnings
