name: NFC-e RTC regression
on:
  push:
    branches:
      - feature/acbr-nfe-bootstrap
    paths:
      - "app/Services/Fiscal/NFCeRtcTaxService.php"
      - "app/Services/Fiscal/NFCeTaxGroupTranslator.php"
      - "app/Services/Fiscal/NFCeIniBuilder.php"
      - "app/Services/Fiscal/NFCePreflightService.php"
      - "tests/Unit/NFCeRtcTaxServiceTest.php"
      - "tests/Feature/NFCeRtcIniTest.php"
      - ".github/workflows/nfce-rtc-tests.yml"
  pull_request:
    paths:
      - "app/Services/Fiscal/**"
      - "tests/**"
jobs:
  nfce-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP 8.3 with database testing extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, dom, xml, openssl
          coverage: none
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint touched PHP
        run: |
          php -l app/Services/Fiscal/NFCeRtcTaxService.php
          php -l app/Services/Fiscal/NFCeTaxGroupTranslator.php
          php -l app/Services/Fiscal/NFCeIniBuilder.php
          php -l app/Services/Fiscal/NFCePreflightService.php
          php -l tests/Unit/NFCeRtcTaxServiceTest.php
          php -l tests/Feature/NFCeRtcIniTest.php
      - name: RTC unit and INI tests
        run: |
          vendor/bin/phpunit --filter=NFCeRtcTaxServiceTest
          vendor/bin/phpunit --filter=NFCeRtcIniTest
          vendor/bin/phpunit --filter=NFCeIniBuilderTest
