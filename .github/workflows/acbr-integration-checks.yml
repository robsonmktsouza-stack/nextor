name: ACBr integration checks
on:
  push:
    branches:
      - feature/acbr-nfe-bootstrap
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, dom, xml, zip
          coverage: none
      - name: PHP syntax check
        run: |
          for f in \
            app/Services/Fiscal/ACBr/ACBrNFeService.php \
            app/Services/Fiscal/NFCeIniBuilder.php \
            app/Services/Fiscal/NFCeTaxCalculationService.php \
            app/Services/Fiscal/FiscalDocumentSettings.php \
            app/Services/Fiscal/FiscalDocumentUtilityService.php \
            app/Http/Controllers/FiscalUtilitiesController.php \
            app/Http/Controllers/NFCeManualController.php \
            app/Services/Fiscal/NFSeTaxRuleApplicationService.php \
            app/Services/Fiscal/NFCePreflightService.php \
            app/Models/FiscalTaxRule.php \
            app/Models/FiscalTaxGroup.php \
            app/Support/FiscalCodeCatalog.php \
            app/Support/FiscalTaxPresetCatalog.php \
            app/Support/FiscalServicePresetCatalog.php \
            app/Http/Controllers/FiscalCodeCatalogController.php \
            app/Models/FiscalFcpRule.php \
            app/Http/Controllers/FiscalFcpRuleController.php \
            database/migrations/2026_10_08_203000_create_fiscal_fcp_rules_table.php \
            app/Services/Fiscal/NFCeTaxGroupTranslator.php \
            app/Http/Controllers/FiscalTaxGroupController.php \
            app/Http/Controllers/ProductController.php \
            app/Http/Controllers/ServiceController.php \
            database/migrations/2026_10_08_201000_create_fiscal_tax_groups_table.php \
            database/migrations/2026_10_08_202000_link_fiscal_tax_groups_to_catalog.php \
            database/migrations/2026_10_09_000001_install_fiscal_tax_group_presets.php \
            database/migrations/2026_10_09_000002_install_fiscal_service_presets.php \
            app/Services/Fiscal/FiscalTaxRuleResolver.php \
            app/Services/Fiscal/NFCeFiscalProfileService.php \
            app/Services/Fiscal/NFCeTaxRuleApplicationService.php \
            app/Http/Controllers/FiscalTaxRuleController.php \
            database/migrations/2026_10_08_200000_create_fiscal_tax_rules_table.php \
            app/Services/Fiscal/NFCeTransmissionService.php \
            app/Services/Fiscal/NFCeProtocolXmlService.php \
            app/Services/Fiscal/NFCeDanfeService.php \
            app/Services/Fiscal/NFCePdfService.php \
            app/Services/Fiscal/NFCeCancellationService.php \
            app/Services/Fiscal/NFCeFiscalEventResponse.php \
            app/Services/Fiscal/NFCeInutilizationService.php \
            app/Services/Fiscal/NFCeOfflineService.php \
            app/Models/NFCeInutilization.php \
            app/Jobs/CancelNFCeJob.php \
            app/Jobs/InutilizeNFCeNumbersJob.php \
            app/Jobs/TransmitOfflineNFCeJob.php \
            app/Http/Controllers/NFCeFiscalEventsController.php \
            app/Http/Controllers/NFCeInutilizationController.php \
            app/Jobs/GenerateNFCeDanfePdfJob.php \
            app/Http/Controllers/NFCeDanfeController.php \
            app/Services/Fiscal/NFCeAuthorizedXmlRecoveryService.php \
            app/Services/Fiscal/NFCeSefazResponseParser.php \
            app/Services/FiscalPreparationService.php \
            app/Services/SalesService.php \
            app/Jobs/ProcessNFCeJob.php \
            app/Jobs/ConsultNFCeJob.php \
            app/Http/Controllers/FiscalController.php \
            app/Console/Commands/ACBrNFCeStatus.php \
            tests/Feature/NFCeIniBuilderTest.php \
            tests/Unit/NFCeTaxCalculationServiceTest.php \
            tests/Feature/FiscalTaxRuleResolverTest.php \
            tests/Feature/NFCeFiscalProfileServiceTest.php \
            tests/Feature/NFCeAutomaticFiscalConfigurationTest.php \
            tests/Unit/NFCeProtocolXmlServiceTest.php \
            tests/Unit/NFCeTaxGroupTranslatorTest.php \
            tests/Unit/FiscalCodeCatalogTest.php \
            tests/Feature/FiscalTaxGroupPersistenceTest.php \
            tests/Feature/FiscalTaxPresetMigrationTest.php \
            tests/Feature/FiscalServicePresetTest.php \
            tests/Feature/FiscalDocumentSettingsTest.php \
            tests/Feature/FiscalUtilitiesTest.php \
            tests/Feature/NFSeTaxRuleApplicationServiceTest.php \
            tests/Feature/FiscalFcpRulePersistenceTest.php \
            tests/Unit/NFCeDanfeServiceTest.php \
            tests/Feature/NFCePrintSettingsTest.php \
            tests/Feature/NFCeManualEditorTest.php \
            tests/Feature/NFCeFiscalLifecycleTest.php \
            tests/Unit/NFCeTaxScenarioMatrixTest.php \
            tests/Feature/UiRefinementTest.php \
            tests/Unit/NFCeSefazResponseParserTest.php; do
            php -l "$f"
          done
      - name: Validate JavaScript syntax
        run: |
          node --check public/js/erp.js
          node --check public/js/fiscal-codes.js
          node --check public/js/nfce-editor.js
          test -s public/css/ui-refinement.css
      - name: Visual table and dropdown regression (Chromium)
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chromium not available; running static checks only"
          else
            for case in ui-select-viewport table-row-density searchable-select; do
              "$BROWSER" --headless=new --no-sandbox --disable-gpu --no-first-run \
                --disable-background-networking --allow-file-access-from-files \
                --window-size=1100,800 --virtual-time-budget=1800 \
                --dump-dom "file://$PWD/tests/browser/$case.html" \
                > "/tmp/nextor-$case.html" 2> "/tmp/nextor-$case-chrome.log"
              case "$case" in
                ui-select-viewport) marker='data-ui-select-test="passed"' ;;
                table-row-density) marker='data-table-density-test="passed"' ;;
                searchable-select) marker='data-search-select-test="passed"' ;;
              esac
              grep -q "$marker" "/tmp/nextor-$case.html" || {
                grep -A2 -B2 'id="testResult"\|id="results"' "/tmp/nextor-$case.html" || true
                tail -n 20 "/tmp/nextor-$case-chrome.log" || true
                exit 1
              }
            done
          fi
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel
        run: |
          cp .env.example .env || touch .env
          php artisan key:generate --force
      - name: Validate registered routes and compiled Blade syntax
        run: |
          php artisan route:list --path=fiscal/rules
          php artisan route:list --path=fiscal/fcp
          php artisan route:list --path=reference/fiscal-codes
          php artisan route:list --path=fiscal/tax-groups
          php artisan route:list --path=fiscal/utilities
          php artisan route:list --path=fiscal/nfce
          php artisan route:list --path=danfe
          php artisan route:list --path=fiscal/utilities
          php artisan view:cache
          find storage/framework/views -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check NFC-e emission and SEFAZ response handling
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php vendor/bin/phpunit --filter='NFCe|FiscalTaxRule|FiscalTaxGroup|FiscalFcpRule|FiscalCodeCatalog|FiscalServicePreset|NFSeTaxRuleApplication|FiscalUtilities|NFCePrintSettings|NFCeManualEditor'

      - name: Full Laravel regression suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php vendor/bin/phpunit
