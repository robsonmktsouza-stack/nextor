name: Stamp first stable Lumeron release
on:
  workflow_run:
    workflows:
      - ACBr integration checks
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  first-stable-tag:
    if: "github.event.workflow_run.conclusion == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Stamp v1.0.0 only on explicitly approved, verified main HEAD
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          CURRENT="$(git rev-parse HEAD)"
          ORIGIN_MAIN="$(git rev-parse origin/main)"
          if [[ "$CURRENT" != "$ORIGIN_MAIN" || "$CURRENT" != "$VERIFIED_SHA" ]]; then
            echo "main moved or test SHA changed; refusing to tag"
            exit 0
          fi
          if [[ "$(git log -1 --format=%s)" != "release: v1.0.0 approved baseline" ]]; then
            echo "Not the one-time v1.0.0 release commit; skipping"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 > /dev/null 2>&1; then
            echo "v1.0.0 already exists; never move a release tag"
            exit 0
          fi
          test -s composer.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.0 -m "Lumeron ERP v1.0.0 - stable production candidate"
          git push origin refs/tags/v1.0.0
          echo "Tagged $CURRENT as v1.0.0. No customer deployment was triggered."
