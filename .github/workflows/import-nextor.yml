name: Importar código-fonte Nextor
on:
  push:
    paths:
      - '.nextor-upload/INICIAR'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair aplicação Laravel
        run: |
          set -euo pipefail
          cat .nextor-upload/part-*.b64 | base64 --decode > /tmp/nextor-src.tar.bz2
          tar -tjf /tmp/nextor-src.tar.bz2 | grep -vE '^/' | grep -q '^app/'
          tar -xjf /tmp/nextor-src.tar.bz2
          rm -rf .nextor-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: importar aplicação ERP Nextor (Laravel)' || true
          git push
