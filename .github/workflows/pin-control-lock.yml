name: Lock standalone control dependencies
on:
  push:
    branches:
      - control-center
permissions:
  contents: write
jobs:
  composer-lock:
    if: "github.event.head_commit.message == 'chore(control): pin dependencies'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, openssl, pdo_sqlite, fileinfo
          coverage: none
      - name: Create and validate lock
        run: |
          composer update --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          php vendor/bin/phpunit
      - name: Save frozen dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(control): version reproducible composer.lock"
          git push origin HEAD:control-center
