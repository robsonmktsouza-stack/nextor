name: Compras - regressão operacional
on:
  push:
    branches: [develop]
    paths:
      - 'app/Models/Purchase*.php'
      - 'app/Models/IncomingNfe.php'
      - 'app/Models/FinancialEntry.php'
      - 'routes/web.php'
      - 'app/Support/CommercialModuleAccess.php'
      - 'app/Services/PurchaseService.php'
      - 'app/Services/InventoryService.php'
      - 'app/Http/Controllers/PurchaseController.php'
      - 'resources/views/purchases/**'
      - 'public/js/purchases.js'
      - 'public/js/nfe-editor.js'
      - 'public/js/pdv.js'
      - 'public/css/purchases.css'
      - 'resources/views/customers/form.blade.php'
      - 'resources/views/fiscal/tax-groups/_advanced.blade.php'
      - 'database/migrations/*purchases*'
      - 'tests/Feature/PurchaseOperationsTest.php'
      - '.github/workflows/purchases-module.yml'
  workflow_dispatch:
jobs:
  purchases:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, libxml, openssl, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate && php artisan optimize:clear
      - run: php artisan view:cache && php -l app/Services/PurchaseService.php && php -l app/Http/Controllers/PurchaseController.php
      - run: node --check public/js/purchases.js && node --check public/js/nfe-editor.js && node --check public/js/pdv.js
      - run: php -d memory_limit=1024M -d display_errors=1 vendor/bin/phpunit --filter=PurchaseOperationsTest --debug --display-errors --display-warnings
